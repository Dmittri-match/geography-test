<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестирование по географии</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --paper: #fff;
      --bg: #f3f7fb;
      --blue: #1769aa;
      --teal: #087f79;
      --line: #dbe4ee;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #e8f3fa, #eef8f4);
    }

    main { width: min(680px, 100%); }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(28px, 7vw, 54px);
      text-align: center;
      box-shadow: 0 14px 35px #17365018;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.15;
      color: #123b67;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .tests {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 32px;
    }

    a {
      display: block;
      padding: 20px 14px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #1769aa, #087f79);
      font-size: 1.15rem;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 5px 12px #1769aa33;
    }

    .hint {
      margin-top: 24px;
      font-size: .92rem;
    }

    @media (max-width: 480px) {
      .tests { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Тестирование по географии</h1>
      <p>Выберите тест для своего класса.</p>

      <nav class="tests">
        <a href="test-11.html">Тест для 11 класса</a>
        <a href="test-12.html">Тест для 12 класса</a>
      </nav>

      <p class="hint">Перед началом заполните фамилию, имя и класс.</p>
    </section>
  </main>
</body>
</html>
