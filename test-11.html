<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Физическая география — тест для 11 класса</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--paper:#fff;--bg:#f3f7fb;--blue:#1769aa;--teal:#087f79;--line:#dbe4ee}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}header{color:#fff;background:linear-gradient(120deg,#123b67,#087f79);padding:32px 20px 28px}.wrap,main{max-width:1000px;margin:auto}h1{margin:0;font-size:clamp(1.65rem,4vw,2.35rem)}h2{margin-top:0}h3{margin:0 0 8px}.subtitle{margin:8px 0 0;opacity:.9}main{margin:24px auto 48px;padding:0 16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 16px #1736500b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-weight:650;margin:0 0 6px}input,textarea{width:100%;border:1px solid #b8c7d8;border-radius:8px;padding:10px 12px;font:inherit;color:inherit;background:#fff}textarea{min-height:145px;resize:vertical}button,.button{display:inline-block;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}button:hover,.button:hover{filter:brightness(.93)}button.secondary,.button.secondary{background:#e6eef6;color:#173b61}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.note,.topic{color:var(--muted)}.progress{height:10px;background:#e5edf5;border-radius:99px;overflow:hidden;margin:12px 0 5px}#bar{height:100%;width:0;background:linear-gradient(90deg,#1774bc,#0a9b87);transition:width .2s}.part{margin:30px 0 14px;font-size:1.25rem;color:#0b5960}.question{scroll-margin-top:16px}.question-head{display:flex;gap:12px;align-items:flex-start}.num{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#e1f2f0;color:#076a65;font-weight:800}.topic{font-size:.87rem;margin:2px 0 12px}.options{display:grid;gap:8px}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:400;margin:0;cursor:pointer}.option:has(input:checked){border-color:#4c9bd5;background:#eff8ff}.option input{width:auto;margin-top:5px}.rubric{padding:11px 13px;background:#fff8e9;border-left:4px solid #e5a129;margin-bottom:12px;font-size:.94rem}.status{font-weight:700}.hidden{display:none}.good{color:#087f4b}.bad{color:#b42318}.review{padding:12px 0;border-top:1px solid var(--line)}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:17px}}@media print{header,.setup,.actions,#result button{display:none!important}body{background:#fff}main{margin:0;max-width:none}.card{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>Физическая география</h1><p class="subtitle">Предварительное тестирование для 11 класса</p></div></header>
<main>
  <section class="card setup" id="setup"><h2>Желаю удачи!</h2><div class="grid"><div><label for="student">Фамилия и имя</label><input id="student" placeholder="Например, Анна Попеску"></div><div><label for="grade">Класс / группа</label><input id="grade" value="11" placeholder="11 «А»"></div><div><label for="teacher">Учитель</label><input id="teacher" placeholder="Необязательно"></div></div><p class="note">На выполнение отводится 45 минут.</p><div class="actions"><button type="button" id="start">Начать тест для 11 класса</button><a class="button secondary" href="index.html">Тест для 12 класса</a></div></section>
  <section id="test" class="hidden"><div class="card"><div class="status" id="welcome"></div><div class="progress"><div id="bar"></div></div><div id="progressText" class="note"></div><div class="actions"><button type="button" class="secondary" id="save">Сохранить черновик</button><button type="button" class="secondary" onclick="window.print()">Распечатать</button><button type="button" id="finish">Завершить и проверить</button></div></div><form id="quiz"></form></section>
  <section id="result" class="card hidden" aria-live="polite"></section>
</main>
<script>
const RESULTS_ENDPOINT='https://script.google.com/macros/s/AKfycbwEx4L2xpUpMwY5-NCZQHCWkR2my9HaICQrsi0GtVLAw7idBSipD6K4IVsByYFijfB6/exec';
const mcq=[
['Литосфера','Как называется верхняя твёрдая оболочка Земли, включающая земную кору и верхнюю часть мантии?',['Атмосфера','Литосфера','Гидросфера','Биосфера','Астеносфера'],1],
['Литосфера','Какая горная порода образуется при застывании магмы?',['Осадочная','Метаморфическая','Магматическая','Органическая','Обломочная'],2],
['Литосфера','Главная причина землетрясений — это:',['Приливы','Движения литосферных плит','Смена времён года','Испарение воды','Солнечная активность'],1],
['Литосфера','Как называется процесс разрушения горных пород на поверхности Земли?',['Выветривание','Вулканизм','Метаморфизм','Седиментация','Кристаллизация'],0],
['Гидросфера','Какой океан является самым большим по площади?',['Атлантический','Индийский','Северный Ледовитый','Тихий','Южный'],3],
['Гидросфера','Как называется количество воды, проходящее через поперечное сечение реки за секунду?',['Падение реки','Уклон реки','Расход воды','Питание реки','Межень'],2],
['Гидросфера','Какое море отличается наиболее высокой солёностью?',['Балтийское','Чёрное','Красное','Карское','Баренцево'],2],
['Гидросфера','Как называется подземный водоносный слой, заключённый между водоупорными породами?',['Грунтовые воды','Артезианские воды','Ледник','Болото','Речная долина'],1],
['Биосфера','Кто ввёл термин «биосфера» и развил учение о её преобразующей роли?',['В. И. Вернадский','Н. Коперник','А. Гумбольдт','Э. Реклю','И. Ньютон'],0],
['Биосфера','Как называется природное сообщество организмов и среды их обитания?',['Экосистема','Литосфера','Муссон','Платформа','Агломерация'],0],
['Биосфера','Какова роль зелёных растений в биосфере?',['Потребляют кислород и создают уголь','Создают органическое вещество при фотосинтезе','Разрушают все горные породы','Увеличивают солёность океана','Создают озоновую дыру'],1],
['Географическая среда','Что называют географической средой?',['Только живую природу','Часть природы, непосредственно взаимодействующую с обществом','Только города и дороги','Всю Вселенную','Только атмосферу'],1],
['Географическая среда','Какой пример относится к рациональному природопользованию?',['Вырубка леса без восстановления','Сброс отходов в реку','Создание лесополос и рекультивация земель','Истребление редких видов','Бесконтрольный вылов рыбы'],2],
['Атмосфера','В каком слое атмосферы сосредоточена основная масса водяного пара и происходит формирование погоды?',['Стратосфера','Тропосфера','Мезосфера','Термосфера','Экзосфера'],1],
['Атмосфера','Как называется прибор для измерения атмосферного давления?',['Термометр','Гигрометр','Барометр','Анемометр','Осадкомер'],2],
['Атмосфера','Какое направление имеет ветер, если он дует с северо-востока?',['На северо-восток','С северо-востока','На юго-запад только ночью','С юго-запада','Вертикально вниз'],1],
['Вселенная','Как называется галактика, в которой находится Солнечная система?',['Андромеда','Млечный Путь','Большое Магелланово Облако','Туманность Ориона','Кассиопея'],1],
['Вселенная','Что является причиной смены дня и ночи?',['Обращение Земли вокруг Солнца','Наклон земной оси','Вращение Земли вокруг своей оси','Движение Луны','Изменение расстояния до Солнца'],2],
['Вселенная','Сколько времени Земля совершает один оборот вокруг Солнца?',['24 часа','30 суток','365 суток и около 6 часов','12 часов','100 лет'],2],
['Климатические пояса','Какой климатический пояс расположен по обе стороны от экватора и отличается сезонной сменой влажных и сухих воздушных масс?',['Экваториальный','Субэкваториальный','Тропический','Умеренный','Арктический'],1],
['Климатические пояса','Для какого пояса характерны круглогодично высокие температуры и обильные осадки?',['Экваториального','Тропического','Субтропического','Умеренного','Антарктического'],0],
['Климатические пояса','Какие воздушные массы преобладают в умеренном климатическом поясе?',['Только экваториальные','Умеренные','Только арктические','Только тропические','Только муссонные'],1],
['Климатические пояса','Какой фактор сильнее всего влияет на различия температуры между экватором и полюсами?',['Географическая широта','Число рек','Солёность океана','Количество городов','Высота зданий'],0],
['Часовые пояса','На сколько часов различается местное время пунктов, расположенных на 15° долготы?',['На 15 минут','На 30 минут','На 1 час','На 2 часа','На 24 часа'],2],
['Часовые пояса','Если в Гринвиче 12:00, то поясное время в пункте на 45° восточной долготы равно:',['09:00','12:00','13:00','15:00','18:00'],3],
['Часовые пояса','В каком направлении при движении вокруг Земли следует переводить часы вперёд?',['На запад','На восток','На север','На юг','Направление не имеет значения'],1],
['Координаты','Как называется расстояние в градусах от экватора до точки?',['Долгота','Широта','Азимут','Высота','Масштаб'],1],
['Координаты','Как называются все точки, лежащие на одной широте?',['Меридиан','Параллель','Горизонталь','Изобара','Изотерма'],1],
['Координаты','Каковы координаты точки на пересечении экватора и нулевого меридиана?',['0° широты, 0° долготы','90° с. ш., 0° д.','0° широты, 180° долготы','90° ю. ш., 90° в. д.','45° с. ш., 45° з. д.'],0],
['Координаты','Точка с координатами 20° ю. ш., 60° з. д. находится в каком полушарии?',['Северном и Восточном','Северном и Западном','Южном и Восточном','Южном и Западном','На экваторе'],3]
];
const openQ=[
['Литосфера','Объясните, как движение литосферных плит связано с образованием гор и землетрясений. Приведите один конкретный регион мира.','Раскрыта связь движения плит с процессами; указан регион; есть корректный пример.'],
['Литосфера','Предложите меры безопасности для населения района, где возможны землетрясения и извержения вулканов.','Не менее трёх реальных мер: мониторинг, устойчивое строительство, обучение, эвакуация и др.'],
['Гидросфера','Сравните значение рек и подземных вод для человека. Укажите не менее трёх видов их использования и возможные экологические риски.','Есть сравнение, три применения и экологические риски.'],
['Гидросфера','Почему проблема дефицита пресной воды особенно остра в отдельных регионах мира? Предложите три способа её решения.','Объяснены причины; предложены три выполнимые меры.'],
['Биосфера','Составьте краткий план охраны биоразнообразия территории, где сокращаются леса и численность животных.','Указаны причины, охранные меры, восстановление и контроль.'],
['Географическая среда','На примере своего региона покажите, как деятельность человека изменяет географическую среду. Оцените один положительный и один отрицательный результат.','Есть конкретный регион, примеры и обоснованная оценка.'],
['Атмосфера и климат','Объясните, почему крупные города часто имеют более тёплый микроклимат, чем окружающая сельская местность.','Названы источники тепла, покрытия, застройка/зеленые зоны; сделан вывод.'],
['Климатические пояса','Сравните экваториальный и умеренный климатические пояса по температуре, осадкам, воздушным массам и растительности.','Сопоставлены минимум четыре признака; использованы термины.'],
['Часовые пояса','Самолёт вылетел из Кишинёва в 10:00 и летел 3 часа в город, расположенный на 30° восточнее. Какое будет местное время при посадке? Покажите рассуждение.','Верно определена разница 2 часа; учтено время полёта; получен ответ 15:00.'],
['Координаты','Опишите алгоритм определения географических координат объекта по карте и объясните, зачем они нужны в жизни и хозяйстве.','Есть последовательный алгоритм, широта/долгота и не менее двух применений.']
];
const quiz=document.getElementById('quiz'),total=40;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let out='<h2 class="part">Часть I. Выберите один правильный ответ (1–30)</h2>';mcq.forEach((q,i)=>out+=`<article class="card question"><div class="question-head"><span class="num">${i+1}</span><div><h3>${q[1]}</h3><div class="topic">${q[0]}</div></div></div><div class="options">${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i+1}" value="${j}"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div></article>`);out+='<h2 class="part">Часть II. Задания на рассуждение (31–40)</h2><p class="note">Ответьте развёрнуто: используйте факты, географические термины, примеры и вывод.</p>';openQ.forEach((q,i)=>{let n=i+31;out+=`<article class="card question"><div class="question-head"><span class="num">${n}</span><div><h3>${q[1]}</h3><div class="topic">${q[0]}</div></div></div><div class="rubric"><strong>Критерии:</strong> ${q[2]}</div><label for="a${n}">Ваш ответ</label><textarea id="a${n}" placeholder="Напишите ответ здесь…"></textarea></article>`});quiz.innerHTML=out;quiz.addEventListener('input',update);quiz.addEventListener('change',update)}
function count(){let n=0;for(let i=1;i<=30;i++)if(document.querySelector(`input[name=q${i}]:checked`))n++;for(let i=31;i<=40;i++)if(document.getElementById('a'+i).value.trim())n++;return n}function update(){let n=count();bar.style.width=n/total*100+'%';progressText.textContent=`Заполнено: ${n} из ${total}`}
function save(){const d={student:student.value,grade:grade.value,teacher:teacher.value,answers:{},open:{}};for(let i=1;i<=30;i++){let v=document.querySelector(`input[name=q${i}]:checked`);if(v)d.answers[i]=v.value}for(let i=31;i<=40;i++)d.open[i]=document.getElementById('a'+i).value;localStorage.setItem('geoTest11',JSON.stringify(d));alert('Черновик сохранён в браузере этого устройства.')}
async function send(score){const answers={},written={};for(let i=1;i<=30;i++){let v=document.querySelector(`input[name=q${i}]:checked`);answers[i]=v?String.fromCharCode(65+Number(v.value)):''}for(let i=31;i<=40;i++)written[i]=document.getElementById('a'+i).value.trim();let b=document.getElementById('sendResult');b.disabled=true;b.textContent='Отправляем…';try{await fetch(RESULTS_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({payload:JSON.stringify({student:student.value.trim(),grade:grade.value.trim(),teacher:teacher.value.trim(),test:'Физическая география — 11 класс',score,answers,written,submittedAt:new Date().toISOString()})})});b.textContent='Результат отправлен';sendStatus.textContent='Готово: результат отправлен учителю.'}catch(e){b.disabled=false;b.textContent='Повторить отправку';sendStatus.textContent='Не удалось отправить. Проверьте интернет и повторите.'}}
start.onclick=()=>{render();setup.classList.add('hidden');test.classList.remove('hidden');welcome.textContent=`Тест для 11 класса • Ученик: ${student.value||'не указан'} • Класс: ${grade.value||'не указан'}`;update();scrollTo({top:test.offsetTop-12,behavior:'smooth'})};save.onclick=save;
finish.onclick=()=>{let score=0,review='';mcq.forEach((q,i)=>{let n=i+1,v=document.querySelector(`input[name=q${n}]:checked`),ok=v&&Number(v.value)===q[3];if(ok)score++;review+=`<div class="review"><strong>Задание ${n}:</strong> <span class="${ok?'good':'bad'}">${ok?'верно':'неверно / нет ответа'}</span>. Правильный ответ: ${String.fromCharCode(65+q[3])} — ${q[2][q[3]]}</div>`});const written=count()-[...Array(30)].filter((_,i)=>document.querySelector(`input[name=q${i+1}]:checked`)).length;result.innerHTML=`<h2>Предварительный результат</h2><p><strong>Тестовая часть: ${score} из 30.</strong> Развёрнутых ответов заполнено: ${written} из 10. Часть II проверяется учителем отдельно.</p><div class="actions"><button class="secondary" id="toggleReview">Показать разбор</button><button id="sendResult">Отправить результат учителю</button><span id="sendStatus" class="note"></span></div><div id="review" class="hidden"><h3 style="margin-top:18px">Разбор тестовой части</h3>${review}</div>`;result.classList.remove('hidden');toggleReview.onclick=()=>review.classList.toggle('hidden');sendResult.onclick=()=>send(score);result.scrollIntoView({behavior:'smooth'})};
</script>
</body></html>
